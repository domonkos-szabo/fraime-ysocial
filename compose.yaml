# FRAIME Social Lab — Surface Pro 9 / Dokploy / x86_64
# Source: https://github.com/YSocialTwin/YSocial (4.x)
# Dokploy Compose service: ysocial; internal port: 5000.
# No published host ports. Attach a domain to service ysocial:5000 in Dokploy.
services:
  ysocial:
    image: ghcr.io/ysocialtwin/ysocial:4.0.0
    restart: unless-stopped
    environment:
      TZ: Europe/Budapest
    volumes:
      - ysocial-data:/data
    expose:
      - "5000"
    mem_limit: 1536m
    mem_reservation: 256m
    cpus: "2.0"
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 30s

volumes:
  ysocial-data:
