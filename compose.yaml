# FRAIME Social Lab — SwarmClaw pilot (isolated branch)
# Deploy in a NEW Dokploy Compose application, NOT over the running YSocial app.
# Domain -> service swarmclaw, port 3456. No host ports published.
services:
  swarmclaw:
    image: ghcr.io/swarmclawai/swarmclaw:latest
    restart: unless-stopped
    environment:
      TZ: Europe/Budapest
      NODE_ENV: production
      PORT: "3456"
      HOSTNAME: "0.0.0.0"
      ACCESS_KEY: ${ACCESS_KEY:?Set a unique ACCESS_KEY in Dokploy environment}
      CREDENTIAL_SECRET: ${CREDENTIAL_SECRET:?Set a stable CREDENTIAL_SECRET in Dokploy environment}
    volumes:
      - swarmclaw-data:/app/data
    expose:
      - "3456"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3456/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 30s

volumes:
  swarmclaw-data:
