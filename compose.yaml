# FRAIME Social Lab — Surface Pro 9 / Dokploy / x86_64
# Source: https://github.com/YSocialTwin/YSocial (4.x)
# Dokploy Compose service: ysocial; internal port: 5000.
# No published host ports. Attach a domain to service ysocial:5000 in Dokploy.
services:
  ysocial:
    image: ghcr.io/domonkos-szabo/fraime-ysocial-lab:sha-fe334119d6fea7d49441d688560aafb86dffbd90
    restart: unless-stopped
    environment:
      TZ: Europe/Budapest
      # SciPy/NLTK OpenBLAS import otherwise exhausts Ray container threads.
      # Confirmed: with 1 thread the import finishes in 0.81 seconds.
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    volumes:
      - ysocial-data:/data
    expose:
      - "5000"
    networks:
      - default
    mem_limit: 2048m
    mem_reservation: 256m
    # Ray uses POSIX shared memory; Docker's default /dev/shm is only 64 MiB.
    shm_size: 256m
    cpus: "2.0"
    # Ray spawns hundreds of OS threads; 384 caused RuntimeError:
    # "can't start new thread" with pids.current=348 and pids.events.max=2.
    # Keep memory/cpu limits unchanged; bound processes independently.
    pids_limit: 1024
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 30s

volumes:
  ysocial-data:

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.10.0/24
