name: Build and optionally publish CPU-only YSocial lab image

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish tested image to GHCR (no deployment)"
        type: boolean
        required: true
        default: false
  pull_request:
    paths:
      - Dockerfile.lab
      - scripts/patch-hpc-lifecycle.py
      - scripts/patch-photo-llm.py
      - scripts/lab-entrypoint.sh
      - .github/workflows/build-lab-image.yml
  push:
    paths:
      - Dockerfile.lab
      - scripts/lab-entrypoint.sh
      - scripts/patch-hpc-lifecycle.py
      - scripts/patch-photo-llm.py
      - .github/workflows/build-lab-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build isolated experimental image
        run: docker build --progress=plain -f Dockerfile.lab -t fraime-ysocial-lab:test .

      - name: Smoke test Python, plugin and CPU-only runtime
        run: |
          docker run --rm --entrypoint python fraime-ysocial-lab:test -c "import torch, ray, detoxify; assert not torch.cuda.is_available(); print('torch', torch.__version__)"
          docker run --rm --entrypoint sh fraime-ysocial-lab:test -c 'test -f /opt/fraime-plugins/YPhotoSharing/run_client.py && test -f /opt/fraime-plugins/YPhotoSharing/run_server.py'
          docker run --rm --entrypoint python fraime-ysocial-lab:test -c "import inspect; import y_web.src.hpc.server as s; import y_web.src.hpc.client as c; assert 'hpc_server_bootstrap.log' in inspect.getsource(s.start_hpc_server); assert 'HPC server not ready' in inspect.getsource(c.start_hpc_client); print('FRAIME HPC lifecycle patch present')"
          docker run --rm --entrypoint python fraime-ysocial-lab:test -c "from langchain_openai import ChatOpenAI; print('OpenAI client available')"
          docker run --rm --entrypoint python fraime-ysocial-lab:test /usr/local/bin/fraime-patch-photo-llm.py --check /opt/fraime-plugins/YPhotoSharing
          docker run --rm --entrypoint python fraime-ysocial-lab:test -c "from pathlib import Path; s=Path('/opt/fraime-plugins/YPhotoSharing/YPhotoSharing/YClient/LLM_interactions/llm_service.py').read_text(); assert 'FRAIME LLM success template=' in s; assert 'ChatOpenAI(**params)' in s; print('FRAIME LLM patch present')"
          docker run --rm --entrypoint python fraime-ysocial-lab:test -m pip check
          docker image inspect fraime-ysocial-lab:test --format 'Image size (bytes): {{.Size}}'

      - name: Sign in to GitHub Container Registry
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested image by immutable commit tag
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/fraime-ysocial-lab
          SHA: ${{ github.sha }}
        run: |
          docker tag fraime-ysocial-lab:test "${IMAGE}:sha-${SHA}"
          docker push "${IMAGE}:sha-${SHA}"
          echo "Published ${IMAGE}:sha-${SHA}" >> "$GITHUB_STEP_SUMMARY"
